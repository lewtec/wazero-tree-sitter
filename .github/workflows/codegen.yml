name: Codegen

on:
  workflow_dispatch:
  schedule:
    # Refresh upstream grammar pins and rebuild wasm once a day.
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - workspaced.cue
      - workspaced.lock.json
      - go.mod
      - go.sum
      - cmd/codegen/**
      - runtime/**
      - mise.toml

concurrency:
  group: codegen
  cancel-in-progress: false

jobs:
  codegen:
    name: update grammars and compile wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

      - name: Refresh grammar pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: workspaced mod lock

      - name: Place grammar C
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # apply may pin host lazy tools into the lock. Keep the source pins
          # from `mod lock` and drop that extra tool noise.
          cp workspaced.lock.json /tmp/workspaced.lock.json
          workspaced codebase apply
          cp /tmp/workspaced.lock.json workspaced.lock.json

      - name: Compile wasm
        continue-on-error: true
        env:
          CGO_ENABLED: "0"
          EMCC_MEMORY_MAX: "4G"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export EMCC="$(mise which emcc)"
          go run ./cmd/codegen

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update grammars and wasm"
          title: "Update grammars and wasm"
          body: |
            Refreshes live `#grammar` pins in `workspaced.lock.json`, places the C
            sources, and recompiles each `grammar.wasm`.

            Click **Approve workflows to run** so Test runs on this PR.
          branch: codegen-update
          delete-branch: true
